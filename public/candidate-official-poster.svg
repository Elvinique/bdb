<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="poster-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="navy-banner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#5c2607" />
    </linearGradient>

    <linearGradient id="hat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>

    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#poster-bg)" />

  <!-- Subtle radial light behind candidate -->
  <circle cx="360" cy="380" r="240" fill="#ffffff" opacity="0.8" filter="url(#glow-light)" />
  <circle cx="150" cy="200" r="160" fill="#38bdf8" opacity="0.15" filter="url(#glow-light)" />

  <!-- TOP HEADER TAG -->
  <g transform="translate(300, 52)">
    <rect x="-180" y="-18" width="360" height="34" rx="17" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1.5" />
    <text x="0" y="5" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="15" 
          letter-spacing="3.5" 
          fill="#0284c7" 
          text-anchor="middle">
      THE BEACON OF HOPE 2027
    </text>
  </g>

  <!-- CAMPAIGN SLOGAN: "Let's BUILD AS One" -->
  <g transform="translate(60, 140)">
    <!-- "Let's" in green script style -->
    <text x="0" y="0" 
          font-family="Georgia, 'Times New Roman', serif" 
          font-style="italic" 
          font-weight="900" 
          font-size="64" 
          fill="#15803d">
      Let's
    </text>
    <!-- Leaf sprouting from the apostrophe -->
    <path d="M 124 -46 C 120 -60, 134 -68, 142 -58 C 148 -48, 136 -40, 124 -46 Z" fill="#22c55e" />
    <path d="M 132 -52 C 140 -64, 154 -56, 146 -46 Z" fill="#16a34a" />

    <!-- "BUILD AS" pill -->
    <g transform="translate(150, -42)">
      <rect x="0" y="0" width="168" height="42" rx="21" fill="#0f172a" />
      <text x="84" y="27" 
            font-family="system-ui, -apple-system, sans-serif" 
            font-weight="900" 
            font-size="20" 
            letter-spacing="2" 
            fill="#ffffff" 
            text-anchor="middle">
        BUILD AS
      </text>
    </g>

    <!-- "One" in royal blue with drop accent -->
    <text x="330" y="0" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="62" 
          fill="#0284c7">
      One
    </text>
    <!-- Blue droplet icon -->
    <path d="M 454 -24 C 454 -38, 464 -52, 464 -52 C 464 -52, 474 -38, 474 -24 C 474 -16, 469 -10, 464 -10 C 459 -10, 454 -16, 454 -24 Z" fill="#38bdf8" />
  </g>

  <!-- CANDIDATE ENG. BURADUM BARIBEFE DANIEL (HIGH FIDELITY VECTOR PORTRAIT) -->
  <g id="candidate-figure" transform="translate(300, 240)">
    <!-- White Tunic Torso & Shoulders -->
    <!-- Shadow under shoulders -->
    <path d="M -170 340 L -140 180 C -120 140, -60 120, 0 120 C 60 120, 120 140, 140 180 L 170 340 Z" fill="#e2e8f0" opacity="0.6" />
    
    <!-- White Traditional Nigerian Kaftan Tunic -->
    <path d="M -165 340 L -135 175 C -115 135, -55 115, 0 115 C 55 115, 115 135, 135 175 L 165 340 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Center Placket with square gold stud buttons -->
    <rect x="-14" y="115" width="28" height="225" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- 4 Square Gold Stud Clasp Buttons -->
    <rect x="-8" y="132" width="16" height="16" rx="2" fill="url(#gold-grad)" stroke="#a16207" stroke-width="1.2" />
    <rect x="-8" y="166" width="16" height="16" rx="2" fill="url(#gold-grad)" stroke="#a16207" stroke-width="1.2" />
    <rect x="-8" y="200" width="16" height="16" rx="2" fill="url(#gold-grad)" stroke="#a16207" stroke-width="1.2" />
    <rect x="-8" y="234" width="16" height="16" rx="2" fill="url(#gold-grad)" stroke="#a16207" stroke-width="1.2" />

    <!-- Red patterned pocket square on left chest -->
    <g transform="translate(-75, 160)">
      <path d="M 0 0 L 32 0 L 30 18 L 2 18 Z" fill="#1e293b" />
      <!-- Folded red handkerchief tips -->
      <polygon points="6,0 14,-14 20,0" fill="#dc2626" />
      <polygon points="12,0 20,-18 28,0" fill="#b91c1c" />
    </g>

    <!-- Gold Chain Necklace layered over chest -->
    <path d="M -42 120 C -40 180, 40 180, 42 120" fill="none" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M -30 70 L -30 120 C -15 130, 15 130, 30 120 L 30 70 Z" fill="url(#skin-grad)" />

    <!-- Face Shape -->
    <path d="M -50 20 C -50 75, -35 105, 0 105 C 35 105, 50 75, 50 20 C 50 -20, -50 -20, -50 20 Z" fill="url(#skin-grad)" />

    <!-- Ears -->
    <path d="M -52 24 C -60 24, -60 48, -50 50 Z" fill="#602506" />
    <path d="M 52 24 C 60 24, 60 48, 50 50 Z" fill="#602506" />

    <!-- Neat Full Black Beard & Mustache -->
    <path d="M -48 35 C -48 85, -32 108, 0 108 C 32 108, 48 85, 48 35 C 40 45, 28 50, 18 52 C 8 53, -8 53, -18 52 C -28 50, -40 45, -48 35 Z" fill="#0f172a" />
    <!-- Mustache -->
    <path d="M -24 58 C -14 52, 0 54, 0 57 C 0 54, 14 52, 24 58 C 16 63, -16 63, -24 58 Z" fill="#0f172a" />

    <!-- Eyes & Brows -->
    <!-- Eyebrows -->
    <path d="M -34 16 Q -20 10 -8 16" fill="none" stroke="#090d16" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 34 16 Q 20 10 8 16" fill="none" stroke="#090d16" stroke-width="4.5" stroke-linecap="round" />
    <!-- Eyes with confident, dignified warmth -->
    <ellipse cx="-20" cy="28" rx="7" ry="4.5" fill="#ffffff" />
    <circle cx="-19" cy="28" r="3.2" fill="#1c1917" />
    <circle cx="-18" cy="27" r="1" fill="#ffffff" />

    <ellipse cx="20" cy="28" rx="7" ry="4.5" fill="#ffffff" />
    <circle cx="19" cy="28" r="3.2" fill="#1c1917" />
    <circle cx="20" cy="27" r="1" fill="#ffffff" />

    <!-- Nose -->
    <path d="M 0 24 L -4 44 C -6 48, -10 50, -10 52 C -8 54, -4 54, 0 54 C 4 54, 8 54, 10 52 C 10 50, 6 48, 4 44 Z" fill="#582306" opacity="0.6" />

    <!-- Mouth -->
    <path d="M -12 68 Q 0 74 12 68" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" />

    <!-- Brown Fedora Hat with Feather -->
    <!-- Hat Crown -->
    <path d="M -54 6 C -56 -40, -45 -70, 0 -72 C 45 -70, 56 -40, 54 6 Z" fill="url(#hat-grad)" stroke="#381a05" stroke-width="1.5" />
    <!-- Fedora Crown Pinch Indent -->
    <path d="M -18 -68 C -8 -56, 8 -56, 18 -68" fill="none" stroke="#381a05" stroke-width="3" opacity="0.5" />

    <!-- Hat Ribbon Band -->
    <path d="M -55 -2 L 55 -2 L 56 8 L -56 8 Z" fill="#291303" />

    <!-- Hat Feather Accent (Red and Yellow feather on left band) -->
    <path d="M -52 4 C -68 -22, -62 -48, -56 -58 C -52 -44, -50 -20, -48 4 Z" fill="#ea580c" />
    <path d="M -50 0 C -60 -18, -58 -38, -54 -46 C -50 -32, -48 -15, -46 0 Z" fill="#facc15" />
    <line x1="-54" y1="6" x2="-56" y2="-54" stroke="#78350f" stroke-width="1" />

    <!-- Fedora Curved Brim -->
    <ellipse cx="0" cy="8" rx="82" ry="16" fill="url(#hat-grad)" stroke="#381a05" stroke-width="2" />
    <ellipse cx="0" cy="11" rx="78" ry="12" fill="#451a03" opacity="0.3" />
  </g>

  <!-- LOWER DIAGONAL NAVY & EMERALD VOTER BANNER -->
  <!-- Emerald Accent Line -->
  <polygon points="0,546 600,470 600,486 0,562" fill="#15803d" />

  <!-- Main Navy Angled Box -->
  <polygon points="0,558 600,482 600,800 0,800" fill="url(#navy-banner-grad)" filter="url(#card-shadow)" />

  <!-- Vote Ballot Box Tag -->
  <g transform="translate(48, 545)">
    <!-- Ballot Checkbox -->
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#ffffff" />
    <!-- Checkmark in Emerald Green -->
    <path d="M 6 14 L 12 20 L 22 8" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="38" y="21" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="20" 
          letter-spacing="2" 
          fill="#ffffff">
      VOTE ENGR.
    </text>
  </g>

  <!-- CANDIDATE LARGE DISPLAY NAME -->
  <text x="48" y="625" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="1" 
        fill="#ffffff">
    BURADUM DANIEL
  </text>
  
  <text x="48" y="675" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="1" 
        fill="#ffffff">
    BARIBEFE
  </text>

  <!-- OFFICE & CONSTITUENCY SUBTITLE -->
  <text x="48" y="710" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="14.5" 
        letter-spacing="1.5" 
        fill="#38bdf8">
    FOR HOUSE OF REPS KHANA/GOKANA FEDERAL CONSTITUENCY
  </text>

  <!-- BOTTOM FOOTER: NNPP PARTY BADGE & PARTY NAME -->
  <g transform="translate(48, 735)">
    <!-- Mini NNPP Emblem -->
    <circle cx="22" cy="22" r="21" fill="#ffffff" stroke="#15803d" stroke-width="2.5" />
    <path d="M 12 12 L 20 12 L 20 32 L 12 32 Z" fill="#15803d" />
    <path d="M 20 12 L 26 12 L 26 32 L 20 32 Z" fill="#ffffff" />
    <path d="M 26 12 L 32 12 L 32 32 L 26 32 Z" fill="#0284c7" />
    <!-- Basket icon -->
    <path d="M 17 24 L 27 24 L 25 30 L 19 30 Z" fill="#92400e" />

    <text x="54" y="27" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="900" 
          font-size="24" 
          letter-spacing="2" 
          fill="#4ade80">
      NNPP
    </text>

    <text x="135" y="26" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="600" 
          font-size="12" 
          letter-spacing="1.5" 
          fill="#cbd5e1">
      NEW NIGERIA PEOPLES PARTY
    </text>
  </g>
</svg>
