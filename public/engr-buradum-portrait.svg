<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#5c2607" />
    </linearGradient>

    <linearGradient id="hat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="50%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Studio Dark Neutral Canvas -->
  <rect width="500" height="600" fill="url(#bg-grad)" />

  <!-- Studio Rim Backlight -->
  <circle cx="250" cy="240" r="180" fill="#047857" opacity="0.18" filter="url(#soft-glow)" />
  <circle cx="360" cy="180" r="140" fill="#0284c7" opacity="0.12" filter="url(#soft-glow)" />

  <!-- CANDIDATE FIGURE: ENGR. BURADUM BARIBEFE DANIEL -->
  <g transform="translate(250, 210)">
    <!-- White Tunic Torso & Shoulders -->
    <path d="M -190 390 L -155 210 C -130 160, -65 135, 0 135 C 65 135, 130 160, 155 210 L 190 390 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

    <!-- Center Placket with square gold stud buttons -->
    <rect x="-16" y="135" width="32" height="255" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- 4 Square Gold Stud Clasp Buttons -->
    <rect x="-9" y="155" width="18" height="18" rx="3" fill="url(#gold-grad)" stroke="#a16207" stroke-width="1.5" />
    <rect x="-9" y="195" width="18" height="18" rx="3" fill="url(#gold-grad)" stroke="#a16207" stroke-width="1.5" />
    <rect x="-9" y="235" width="18" height="18" rx="3" fill="url(#gold-grad)" stroke="#a16207" stroke-width="1.5" />
    <rect x="-9" y="275" width="18" height="18" rx="3" fill="url(#gold-grad)" stroke="#a16207" stroke-width="1.5" />

    <!-- Red patterned pocket square on left chest -->
    <g transform="translate(-85, 190)">
      <path d="M 0 0 L 36 0 L 34 22 L 2 22 Z" fill="#1e293b" />
      <!-- Folded red handkerchief tips -->
      <polygon points="6,0 15,-16 22,0" fill="#dc2626" />
      <polygon points="14,0 23,-20 32,0" fill="#b91c1c" />
    </g>

    <!-- Gold Chain Necklace layered over chest -->
    <path d="M -48 135 C -46 200, 46 200, 48 135" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M -34 80 L -34 140 C -18 150, 18 150, 34 140 L 34 80 Z" fill="url(#skin-grad)" />

    <!-- Face Shape -->
    <path d="M -56 25 C -56 90, -40 120, 0 120 C 40 120, 56 90, 56 25 C 56 -20, -56 -20, -56 25 Z" fill="url(#skin-grad)" />

    <!-- Ears -->
    <path d="M -58 30 C -68 30, -68 56, -56 58 Z" fill="#602506" />
    <path d="M 58 30 C 68 30, 68 56, 56 58 Z" fill="#602506" />

    <!-- Neat Full Black Beard & Mustache -->
    <path d="M -54 40 C -54 96, -36 124, 0 124 C 36 124, 54 96, 54 40 C 45 52, 32 58, 20 60 C 9 61, -9 61, -20 60 C -32 58, -45 52, -54 40 Z" fill="#090d16" />
    <!-- Mustache -->
    <path d="M -26 68 C -16 61, 0 63, 0 66 C 0 63, 16 61, 26 68 C 18 74, -18 74, -26 68 Z" fill="#090d16" />

    <!-- Eyebrows -->
    <path d="M -38 20 Q -22 13 -9 20" fill="none" stroke="#090d16" stroke-width="5" stroke-linecap="round" />
    <path d="M 38 20 Q 22 13 9 20" fill="none" stroke="#090d16" stroke-width="5" stroke-linecap="round" />

    <!-- Eyes with confident, dignified warmth -->
    <ellipse cx="-22" cy="34" rx="8" ry="5" fill="#ffffff" />
    <circle cx="-21" cy="34" r="3.6" fill="#1c1917" />
    <circle cx="-20" cy="33" r="1.2" fill="#ffffff" />

    <ellipse cx="22" cy="34" rx="8" ry="5" fill="#ffffff" />
    <circle cx="21" cy="34" r="3.6" fill="#1c1917" />
    <circle cx="22" cy="33" r="1.2" fill="#ffffff" />

    <!-- Nose -->
    <path d="M 0 30 L -5 50 C -7 55, -11 57, -11 60 C -9 62, -5 62, 0 62 C 5 62, 9 62, 11 60 C 11 57, 7 55, 5 50 Z" fill="#582306" opacity="0.6" />

    <!-- Mouth -->
    <path d="M -14 78 Q 0 85 14 78" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />

    <!-- Brown Fedora Hat with Feather -->
    <!-- Hat Crown -->
    <path d="M -60 10 C -62 -42, -50 -76, 0 -78 C 50 -76, 62 -42, 60 10 Z" fill="url(#hat-grad)" stroke="#381a05" stroke-width="2" />
    <!-- Fedora Crown Pinch Indent -->
    <path d="M -20 -74 C -9 -60, 9 -60, 20 -74" fill="none" stroke="#381a05" stroke-width="3.5" opacity="0.5" />

    <!-- Hat Ribbon Band -->
    <path d="M -61 0 L 61 0 L 62 12 L -62 12 Z" fill="#291303" />

    <!-- Hat Feather Accent (Red and Yellow feather on left band) -->
    <path d="M -58 6 C -75 -24, -68 -54, -62 -65 C -58 -50, -56 -24, -54 6 Z" fill="#ea580c" />
    <path d="M -56 2 C -67 -18, -64 -42, -60 -52 C -56 -36, -54 -18, -52 2 Z" fill="#facc15" />
    <line x1="-60" y1="8" x2="-62" y2="-62" stroke="#78350f" stroke-width="1.2" />

    <!-- Fedora Curved Brim -->
    <ellipse cx="0" cy="12" rx="92" ry="18" fill="url(#hat-grad)" stroke="#381a05" stroke-width="2" />
    <ellipse cx="0" cy="15" rx="88" ry="14" fill="#451a03" opacity="0.3" />
  </g>

  <!-- Bottom Vignette -->
  <rect y="520" width="500" height="80" fill="url(#bg-grad)" opacity="0.9" />

  <!-- Bottom Badge -->
  <g transform="translate(250, 560)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#0f172a" stroke="#15803d" stroke-width="2" />
    <text x="0" y="6" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-weight="800" 
          font-size="14" 
          letter-spacing="1.5" 
          fill="#4ade80" 
          text-anchor="middle">
      ENGR. BURADUM BARIBEFE DANIEL
    </text>
  </g>
</svg>
